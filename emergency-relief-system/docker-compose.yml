services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-emergency_relief_db}
      MYSQL_USER: ${MYSQL_USER:-relief_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-me}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    command: gunicorn --bind 0.0.0.0:5000 run:app
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-relief_user}:${MYSQL_PASSWORD:-change-me}@mysql:3306/${MYSQL_DATABASE:-emergency_relief_db}
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: .
    command: streamlit run frontend/app.py --server.address 0.0.0.0 --server.port 8501
    env_file: .env
    environment:
      API_URL: http://backend:5000
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  mysql_data:
